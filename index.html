    <script>
      // Suppress Vite HMR WebSocket connection errors in sandbox preview environments
      (function() {
        const OrigWS = window.WebSocket;
        if (OrigWS) {
          window.WebSocket = function(url, protocols) {
            try {
              const ws = new OrigWS(url, protocols);
              ws.addEventListener('error', function(e) {
                e.stopImmediatePropagation?.();
              });
              return ws;
            } catch (err) {
              if (String(url).includes('vite') || String(url).includes('3000') || String(url).includes('ws')) {
                return {
                  send: function() {},
                  close: function() {},
                  addEventListener: function() {},
                  removeEventListener: function() {},
                  readyState: 3
                };
              }
              throw err;
            }
          };
          window.WebSocket.prototype = OrigWS.prototype;
          window.WebSocket.CONNECTING = OrigWS.CONNECTING;
          window.WebSocket.OPEN = OrigWS.OPEN;
          window.WebSocket.CLOSING = OrigWS.CLOSING;
          window.WebSocket.CLOSED = OrigWS.CLOSED;
        }

        window.addEventListener('unhandledrejection', function(event) {
          if (event.reason && String(event.reason).includes('WebSocket closed without opened')) {
            event.preventDefault();
          }
        });
      })();
    </script>
